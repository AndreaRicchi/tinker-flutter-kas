# kas project: ASUS Tinker Board S running the Flutter gallery on flutter-pi.

header:
  version: 23

machine: tinker-board-s
distro: nodistro
target: core-image-base

defaults:
  repos:
    branch: wrynose

repos:
  bitbake:
    url: "https://git.openembedded.org/bitbake"
    branch: "2.18"
    commit: "6e260eb6ab1631607ea414d9ff8ede1155faa5d9"
    path: "layers/bitbake"
    layers:
      .: disabled

  openembedded-core:
    url: "https://git.openembedded.org/openembedded-core"
    commit: "ae5a301091f5b0574ea7444aab40b309b6d9f3f2"
    path: "layers/openembedded-core"
    layers:
      meta:

  meta-openembedded:
    url: "https://github.com/openembedded/meta-openembedded"
    commit: "c734c2cb9713dbd6d50697a9f6c25ebdf3ae589e"
    path: "layers/meta-openembedded"
    layers:
      meta-oe:
      meta-python:

  meta-arm:
    url: "https://git.yoctoproject.org/git/meta-arm"
    commit: "673e8d7c5dcd14de58092eb73e6ecc5eee5c1735"
    path: "layers/meta-arm"
    layers:
      meta-arm-toolchain:
      meta-arm:

  meta-rockchip:
    url: "https://git.yoctoproject.org/git/meta-rockchip"
    commit: "9d02575bfd9ca5e87c394f593f2bbdbdee914d4e"
    path: "layers/meta-rockchip"

  meta-flutter:
    url: "https://github.com/meta-flutter/meta-flutter"
    commit: "46ef6e3b1b5c92a283f6ae340438bf05b57c584d"
    path: "layers/meta-flutter"

  tinker-flutter-kas:
    layers:
      meta-tinker-flutter:

local_conf_header:
  standard: |
    MACHINE_EXTRA_RRECOMMENDS += "kernel-modules"
    INIT_MANAGER = "systemd"
    IMAGE_INSTALL:append = " \
        flutter-pi \
        flutter-sdk-dev-integration-tests-flutter-gallery \
    "
    TOOLCHAIN_HOST_TASK:append = " nativesdk-flutter-sdk"

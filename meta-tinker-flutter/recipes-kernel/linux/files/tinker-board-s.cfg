# Options that multi_v7_defconfig only gets through `select` from platforms
# meta-rockchip disables in bsp/rockchip/remove-non-rockchip-arch-arm.cfg
# (ARCH_OMAP2PLUS, ARCH_VEXPRESS, ARCH_VIRT, ARCH_U8500, ...). The defconfig
# never lists them itself, so removing the platforms drops them silently.
# Found by diffing the expanded multi_v7_defconfig against the built .config.

# Boot: vcc_sys and vcc_io in rk3288-tinker.dtsi are regulator-fixed and
# supply every RK808 regulator. Without the driver the PMIC registers nothing
# and the SD host waits for vmmc forever ("Waiting for root device").
CONFIG_REGULATOR_FIXED_VOLTAGE=y

# Userspace: the image is built for cortexa17t2hf-neon. Without VFP the first
# floating point instruction kills every process.
CONFIG_VFP=y
CONFIG_VFPv3=y
CONFIG_NEON=y
CONFIG_KERNEL_MODE_NEON=y

# Display: ROCKCHIP_PM_DOMAINS depends on HAVE_ARM_SMCCC_DISCOVERY, which
# comes with ARM_PSCI. Without it the VOPs, HDMI and IOMMUs in pd_vio never
# probe. The board has no PSCI firmware; the option is only the dependency.
CONFIG_ARM_PSCI=y
CONFIG_ROCKCHIP_PM_DOMAINS=y

# Memory: the board has 2 GB, a kernel without HIGHMEM uses 768 MB of it.
CONFIG_HIGHMEM=y

# Peripherals: RTL8211E Ethernet PHY, and the generic-ehci/generic-ohci USB
# host controllers of the RK3288.
CONFIG_REALTEK_PHY=y
CONFIG_USB_EHCI_HCD_PLATFORM=y
CONFIG_USB_OHCI_HCD_PLATFORM=y
